services:
  # the only way in: dials out to Cloudflare, so the host needs no open ports
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in deploy/.env}
    depends_on:
      - caddy

  caddy:
    image: caddy:2
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app
      - auth
      - room

  app:
    build:
      context: ..
      dockerfile: deploy/app.Dockerfile
      args:
        PUBLIC_URL: https://${DOMAIN:?set DOMAIN in deploy/.env}
    restart: unless-stopped

  auth:
    build: ../server
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_URL: https://${DOMAIN}
      DATA_DIR: /data
    volumes:
      - auth_data:/data

  room:
    build:
      context: .
      dockerfile: room.Dockerfile
    restart: unless-stopped

volumes:
  # sessions and every stored drawing, share link and image
  auth_data:
